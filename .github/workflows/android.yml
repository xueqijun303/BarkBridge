name: Android

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.BARKBRIDGE_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.BARKBRIDGE_KEYSTORE_BASE64 }}" | base64 --decode > "${{ runner.temp }}/barkbridge-release.jks"
          echo "BARKBRIDGE_STORE_FILE=${{ runner.temp }}/barkbridge-release.jks" >> "$GITHUB_ENV"
          echo "BARKBRIDGE_STORE_PASSWORD=${{ secrets.BARKBRIDGE_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "BARKBRIDGE_KEY_ALIAS=${{ secrets.BARKBRIDGE_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "BARKBRIDGE_KEY_PASSWORD=${{ secrets.BARKBRIDGE_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/BarkBridge_v1.3.2-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/BarkBridge_v1.3.2-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/BarkBridge_v1.3.2-release-unsigned.apk
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BarkBridge APKs
          path: artifacts/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
