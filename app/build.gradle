plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def signingValue = { String name ->
    return System.getenv(name) ?: localProperties.getProperty(name)
}

android {
    namespace "com.xueqijun.barkbridge"
    compileSdk 35

    defaultConfig {
        applicationId "com.xueqijun.barkbridge"
        minSdk 26
        targetSdk 35
        versionCode 26
        versionName "1.3.14"
    }

    signingConfigs {
        release {
            def storeFilePath = signingValue("BARKBRIDGE_STORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword signingValue("BARKBRIDGE_STORE_PASSWORD")
                keyAlias signingValue("BARKBRIDGE_KEY_ALIAS")
                keyPassword signingValue("BARKBRIDGE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (signingValue("BARKBRIDGE_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}
